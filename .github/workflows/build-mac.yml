name: Build for macOS

# The Mac build: a universal .dmg (Apple silicon and Intel), signed with a Developer ID and
# notarized. It runs for every version tag and on demand; the .dmg is attached to the run
# (Actions > this run > Artifacts) and added to the GitHub release by hand, like the Windows
# installer. Signing secrets: MAC_CERT_P12 (the .p12, base64), MAC_CERT_PASSWORD,
# APPLE_API_KEY_P8 (the .p8 file's text), APPLE_API_KEY_ID and APPLE_API_ISSUER. Without them
# the .dmg is ad-hoc signed and not notarized, as before.
on:
  push:
    tags: ["v*"]
    # TEMPORARY, remove before merging: test builds of the signing branch.
    branches: ["feat/mac-signing"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Build the dmg
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -o pipefail
          if [ -n "$CSC_LINK" ]; then
            # electron-builder wants the API key as a file.
            export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
            printf '%s\n' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY"
            echo "SIGNED=1" >> "$GITHUB_ENV"
            npm run dist:mac 2>&1 | tee build.log
          else
            echo "::warning title=Not signed::No signing secrets: ad-hoc signature, not notarized"
            # Missing secrets arrive as empty variables, which electron-builder would read as paths.
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_ID APPLE_API_ISSUER
            npm run dist:mac -- -c.mac.identity=- -c.mac.hardenedRuntime=false -c.mac.notarize=false 2>&1 | tee build.log
          fi
      - name: Check the app
        run: |
          set -o pipefail
          app="release/mac-universal/PDF Diva.app"
          {
            lipo -archs "$app/Contents/MacOS/PDF Diva"
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dvv "$app" 2>&1 | grep -E '^(Authority|TeamIdentifier|Runtime)'
            if [ -n "$SIGNED" ]; then
              xcrun stapler validate "$app"
              spctl --assess --type execute --verbose=2 "$app"
            fi
            plutil -p "$app/Contents/Info.plist" | grep -A12 CFBundleDocumentTypes
          } 2>&1 | tee check.log
          echo "::notice title=Signature::$(grep -E '^(Authority|TeamIdentifier|Runtime)|accepted|rejected|validate action' check.log | awk '{printf "%s%%0A", $0}')"
      # Runs the packaged app on the runner's display: there is no Mac to try it on by hand.
      - name: Smoke test
        run: |
          set -o pipefail
          node scripts/smoke-test.mjs "release/mac-universal/PDF Diva.app/Contents/MacOS/PDF Diva" 2>&1 | tee smoke.log
          echo "::notice title=Smoke test::$(grep -E '^(OK|FAIL|ALL|SMOKE)' smoke.log | awk '{printf "%s%%0A", $0}')"
      - uses: actions/upload-artifact@v7
        with:
          name: PDF-Diva-mac
          path: release/*.dmg
          if-no-files-found: error
      # Annotations can be read without signing in to GitHub, unlike the log: the end of the log
      # of the step that failed goes there (an annotation holds about 4 KB).
      - name: Report a failure
        if: failure()
        run: |
          for log in smoke.log check.log build.log; do
            if [ -f "$log" ]; then
              tail -n 25 "$log" | cut -c1-150 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' > tail.txt
              echo "::error title=End of $log::$(cat tail.txt)"
              break
            fi
          done
