<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; worker-src 'self'"
    />
    <title>PDF Presenter - Orador</title>
    <link rel="stylesheet" href="../shared/theme.css" />
    <link rel="stylesheet" href="presenter.css" />
  </head>
  <body>
    <header id="top">
      <span class="icon timer-icon" data-icon="timer"></span>
      <span id="clock">00:00:00</span>
      <button id="pause" class="btn" type="button">
        <span class="icon" id="pause-icon" data-icon="pause"></span><span id="pause-label">Pausar</span>
      </button>
      <button id="reset" class="btn" type="button">
        <span class="icon" data-icon="arrow-counter-clockwise"></span>Reiniciar
      </button>
      <span id="paused" hidden>En pausa</span>
    </header>

    <main id="main">
      <div id="maincol">
        <div id="current">
          <span id="badge" hidden>
            <span class="icon" data-icon="eye-slash"></span>Pantalla del público en negro
          </span>
          <canvas id="canvas"></canvas>
        </div>
        <div id="count"></div>
      </div>
      <div id="side">
        <div id="next">
          <canvas id="next-canvas"></canvas>
          <span id="end" hidden>Fin de la presentación</span>
        </div>
        <h3>Siguiente</h3>
      </div>
    </main>

    <footer id="bottom">
      <button id="prev" class="nav" type="button">
        <span class="icon" data-icon="caret-left"></span>Anterior
      </button>
      <button id="forward" class="nav go" type="button">
        Siguiente<span class="icon" data-icon="caret-right"></span>
      </button>
      <span class="spacer"></span>
      <button id="black" class="btn tool" type="button" aria-pressed="false">
        <span class="icon" data-icon="eye-slash"></span>Pantalla en negro
      </button>
      <button id="exit" class="btn tool exit" type="button">
        <span class="icon" data-icon="x"></span>Salir
      </button>
    </footer>
    <script src="presenter.js"></script>
  </body>
</html>
